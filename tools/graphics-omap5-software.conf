# Diagnostic Screen configuration: software window composition with BMW's
# original OMAP EGL/GLES client libraries registered, but without the SGX
# kernel GPU modules. This probes whether the EGL front-end can stay alive on
# QEMU while Screen handles ordinary windows in software.
begin khronos
    begin egl display 1
        egl-dlls = [IMG%s] libusc.so libsrv_um.so libpvr2d.so libIMGegl.so
        glesv1-dlls = libusc.so libsrv_um.so libIMGegl.so libImgGLESv1_CM.so
        glesv2-dlls = libusc.so libsrv_um.so libusc.so libIMGegl.so libImgGLESv2.so
        gpu-string = SGX540rev120
        aperture = 250
        sgx-dumpfile = /var/dump/sgxdump.txt
        sgx-dumpfile-maxsize = 1048576
    end egl display

    begin wfd device 1
        wfd-dlls = libwfdcfg.so libWFDomap5430ES2_0.so
        gfx = 1
    end wfd device
end khronos

begin winmgr
    begin globals
        blit-config = sw
    end globals
    begin display 1
        formats = rgba8888 rgbx8888
        video-mode = 1440 x 540 @ 60
    end display
    begin class framebuffer1
        display = 1
        pipeline = 4
        format = rgba8888
        usage = sw
    end class
end winmgr
